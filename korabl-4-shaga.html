<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управляй кораблём — 4 шага</title>
<style>
  :root{
    --violet:#8b7fe8;
    --violet-bar:#a99df0;
    --violet-deep:#6c5ce7;
    --teal:#1fb6c9;
    --orange:#f5a623;
    --ink:#2d2d3a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','SF Pro Display',system-ui,-apple-system,sans-serif;
    background:#e9e9ef;
    display:flex;align-items:center;justify-content:center;
    padding:12px;
  }
  .player{
    width:min(960px,100%);
    aspect-ratio:2/1;
    min-height:430px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 8px 40px rgba(60,50,120,.18);
    overflow:hidden;
    display:flex;flex-direction:column;
    position:relative;
  }

  /* ── верхняя панель ─────────────────────────── */
  .topbar{
    height:56px;flex:0 0 56px;
    background:linear-gradient(180deg,var(--violet-bar),#9c90ec);
    display:flex;align-items:center;gap:14px;
    padding:0 16px;
    color:#fff;
    user-select:none;
  }
  .back{
    font-size:22px;cursor:pointer;line-height:1;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:background .15s;
  }
  .back:hover{background:rgba(255,255,255,.15);}
  .hex{
    width:34px;height:34px;background:var(--teal);
    clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0% 50%);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;
  }
  .crystals{
    background:rgba(255,255,255,.92);color:var(--ink);
    border-radius:18px;padding:5px 12px;
    font-weight:700;font-size:15px;
    display:flex;align-items:center;gap:5px;
  }
  .crystal{font-size:14px;filter:hue-rotate(90deg);}

  /* прогресс чанка */
  .chunk{
    flex:1;display:flex;align-items:center;gap:8px;
    max-width:420px;
  }
  .track{
    position:relative;flex:1;height:26px;
    display:flex;align-items:center;
  }
  .dots{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px;
  }
  .dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.65);}
  .fill{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    height:22px;border-radius:12px;
    background:linear-gradient(180deg,#ffc25c,var(--orange));
    width:26px;
    transition:width .8s cubic-bezier(.6,.05,.3,1.2);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .fill::after{ /* ведущий кружок */
    content:'';position:absolute;right:1px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;
    background:#ffd98a;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
  }
  .plus24{
    display:flex;align-items:center;gap:3px;
    font-weight:700;font-size:14px;white-space:nowrap;
  }
  .pet{
    width:34px;height:26px;background:#eafcfa;border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .howcard{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:600;opacity:.95;
  }
  .howcard span.e{font-size:19px;cursor:pointer;transition:transform .15s;}
  .howcard span.e:hover{transform:scale(1.2);}

  /* ── сцена ──────────────────────────────────── */
  .stage{
    flex:1;position:relative;
    display:flex;align-items:center;justify-content:center;
    gap:56px;
    padding:20px;
  }

  /* сетка */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    width:min(330px,42vw);aspect-ratio:1/1;
    border:1.5px solid #b9b9c6;
    position:relative;
  }
  .cell{
    border:1.5px solid #b9b9c6;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(38px,6.2vw,58px);
    user-select:none;
  }
  .ship{
    position:absolute;
    width:33.333%;height:33.333%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(40px,6.6vw,62px);
    transition:left .7s cubic-bezier(.45,.05,.35,1.15), top .7s cubic-bezier(.45,.05,.35,1.15);
    z-index:3;
    filter:drop-shadow(0 3px 3px rgba(0,0,60,.18));
  }

  /* ── правая часть: пульт ────────────────────── */
  .side{display:flex;flex-direction:column;gap:10px;align-items:flex-start;position:relative;}
  @keyframes bubbleIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  .pad{
    border:1.5px solid #444;border-radius:34px;
    padding:34px 26px 26px;
    display:grid;
    grid-template-columns:repeat(3,72px);
    grid-template-rows:72px 72px;
    gap:8px;justify-items:center;align-items:center;
    position:relative;background:#fff;
  }
  .arrow{
    width:66px;height:66px;border-radius:50%;
    border:2px solid #333;background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
    transition:transform .12s, opacity .4s, border-color .2s, background .2s;
  }
  .arrow svg{width:34px;height:34px;stroke:#222;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .arrow:hover:not(.locked){transform:scale(1.08);background:#f6f5ff;}
  .arrow:active:not(.locked){transform:scale(.95);}
  .arrow.up{grid-column:2;grid-row:1;}
  .arrow.left{grid-column:1;grid-row:2;}
  .arrow.down{grid-column:2;grid-row:2;}
  .arrow.right{grid-column:3;grid-row:2;}

  .arrow.correct{
    border-color:var(--violet-deep);
    background:#efeaff;
    animation:pulse .5s ease;
  }
  @keyframes pulse{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1.1);}}
  .arrow.faded{opacity:.25;pointer-events:none;}
  .arrow.locked{pointer-events:none;}
  .arrow.wrong{animation:shake .45s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}80%{transform:translateX(5px);}
  }

  /* ── частицы саксесса ───────────────────────── */
  .burst{position:absolute;pointer-events:none;z-index:20;}
  .p{
    position:absolute;left:0;top:0;
    animation:fly .8s cubic-bezier(.2,.7,.4,1) forwards;
  }
  .p.drop{
    width:11px;height:14px;background:var(--violet-deep);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  }
  .p.star{
    width:16px;height:16px;
    background:#fff;
    clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
    filter:drop-shadow(0 0 3px rgba(108,92,231,.55));
  }
  @keyframes fly{
    0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1;}
    70%{opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(1.05) rotate(var(--rot));opacity:0;}
  }

  /* ── переход между экранами ─────────────────── */
  .flash{
    position:absolute;inset:0;background:#fff;z-index:30;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .flash.on{opacity:1;pointer-events:all;}

  /* ── финальный экран ────────────────────────── */
  .final{
    position:absolute;inset:0;z-index:25;
    background:linear-gradient(180deg,#f6f4ff,#eef9ff);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;
  }
  .final.show{display:flex;animation:bubbleIn .5s ease;}
  .final .big{font-size:72px;animation:bounceIn .7s cubic-bezier(.3,1.6,.4,1);}
  @keyframes bounceIn{from{transform:scale(0);}to{transform:scale(1);}}
  .final h2{color:var(--violet-deep);font-size:26px;}
  .final p{color:#666;font-size:15px;}
  .final .reward{
    background:#fff;border-radius:20px;padding:8px 18px;
    font-weight:700;font-size:17px;color:var(--ink);
    box-shadow:0 3px 12px rgba(108,92,231,.2);
  }
  .again{
    margin-top:6px;border:none;background:var(--violet-deep);color:#fff;
    font-size:15px;font-weight:700;padding:11px 26px;border-radius:24px;
    cursor:pointer;transition:transform .15s, box-shadow .15s;
    box-shadow:0 4px 14px rgba(108,92,231,.4);
  }
  .again:hover{transform:translateY(-2px);}

  .stepLabel{
    position:absolute;left:14px;bottom:10px;
    font-size:11px;color:#aaa;user-select:none;
  }
</style>
</head>
<body>

<div class="player">

  <!-- верхняя панель -->
  <div class="topbar">
    <div class="back">←</div>
    <div class="hex">1</div>
    <div class="crystals">143 <span class="crystal">💎</span></div>

    <div class="chunk">
      <div class="track">
        <div class="dots" id="dots"></div>
        <div class="fill" id="fill"></div>
      </div>
      <div class="plus24">+24 <span class="crystal">💎</span></div>
      <div class="pet">🦕</div>
    </div>

    <div class="howcard">Как карточка? <span class="e">😭</span> <span class="e">😍</span></div>
  </div>

  <!-- сцена -->
  <div class="stage">
    <div class="grid" id="grid"></div>

    <div class="side">
      <div class="pad" id="pad">
        <div class="arrow up"    data-dir="up"><svg viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></svg></div>
        <div class="arrow left"  data-dir="left"><svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg></div>
        <div class="arrow down"  data-dir="down"><svg viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></svg></div>
        <div class="arrow right" data-dir="right"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></div>
      </div>
    </div>

    <div class="stepLabel" id="stepLabel">Чанк 1 · Шаг 1 из 4</div>
  </div>

  <!-- финал -->
  <div class="final" id="final">
    <div class="big">🏝️⛵</div>
    <h2>Ура! Корабль доплыл до острова!</h2>
    <p>Все 4 шага пройдены — чанк выполнен</p>
    <div class="reward">+24 💎</div>
    <button class="again" onclick="restart()">Пройти ещё раз</button>
  </div>

  <div class="flash" id="flash"></div>
</div>

<script>
/* ── данные ─────────────────────────────────────── */
const MAP = [                     // r,c
  ['⛵','', '⛰️'],
  ['⛰️','', '⛰️'],
  ['🏝️','', ''  ]
];
const START = {r:0,c:0};
const PATH  = ['right','down','down','left'];   // обяз. шаги = 4
const TEXTS = {
  first:  'Управляй кораблём, чтобы добраться до острова. Куда нужно поехать сначала?',
  next:   'Куда нужно поехать сейчас?',
  congrat:{right:'Вправо!',down:'Вниз!',left:'Влево!',up:'Вверх!'}
};
const DELTA = {up:{r:-1,c:0},down:{r:1,c:0},left:{r:0,c:-1},right:{r:0,c:1}};

/* ── состояние ──────────────────────────────────── */
let step = 0;
let ship = {...START};
let locked = false;

/* ── построение ─────────────────────────────────── */
const grid = document.getElementById('grid');
function buildGrid(){
  grid.innerHTML = '';
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){
    const d = document.createElement('div');
    d.className = 'cell';
    d.textContent = (r===START.r&&c===START.c) ? '' : MAP[r][c];
    grid.appendChild(d);
  }
  const s = document.createElement('div');
  s.className = 'ship'; s.id = 'shipEl'; s.textContent = '⛵';
  grid.appendChild(s);
  placeShip();
}
function placeShip(){
  const s = document.getElementById('shipEl');
  s.style.left = (ship.c*33.333)+'%';
  s.style.top  = (ship.r*33.333)+'%';
}

/* точки трека */
const dotsBox = document.getElementById('dots');
for(let i=0;i<14;i++){dotsBox.appendChild(document.createElement('i'));}

/* ── прогресс чанка ─────────────────────────────── */
function setProgress(done){                 // done: 0..4
  const min = 26;                           // стартовый «кружок»
  const pct = done/PATH.length;
  document.getElementById('fill').style.width =
    `calc(${min}px + (100% - ${min}px) * ${pct})`;
}

/* ── тексты ─────────────────────────────────────── */
function refresh(){
  document.getElementById('stepLabel').textContent =
    `Чанк 1 · Шаг ${step+1} из 4`;
}

/* ── частицы ────────────────────────────────────── */
function burst(el){
  const rect = el.getBoundingClientRect();
  const host = el.closest('.player').getBoundingClientRect();
  const b = document.createElement('div');
  b.className='burst';
  b.style.left=(rect.left-host.left+rect.width/2)+'px';
  b.style.top =(rect.top -host.top +rect.height/2)+'px';
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.className='p '+(i%2?'drop':'star');
    const ang=(i/14)*Math.PI*2 + Math.random()*.5;
    const dist=46+Math.random()*40;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist-14+'px');
    p.style.setProperty('--rot',(Math.random()*180-90)+'deg');
    p.style.animationDelay=(Math.random()*.08)+'s';
    b.appendChild(p);
  }
  el.closest('.player').appendChild(b);
  setTimeout(()=>b.remove(),950);
}

/* ── переход-«экран» ────────────────────────────── */
const flash=document.getElementById('flash');
function screenSwap(cb){
  flash.classList.add('on');
  setTimeout(()=>{cb(); setTimeout(()=>flash.classList.remove('on'),120);},320);
}

/* ── логика клика ───────────────────────────────── */
const pad=document.getElementById('pad');
pad.addEventListener('click',e=>{
  const btn=e.target.closest('.arrow');
  if(!btn||locked) return;
  const dir=btn.dataset.dir;

  if(dir===PATH[step]){
    locked=true;
    btn.classList.add('correct');
    pad.querySelectorAll('.arrow').forEach(a=>{
      a.classList.add('locked');
      if(a!==btn)a.classList.add('faded');
    });
    burst(btn);

    /* кораблик едет */
    setTimeout(()=>{
      ship.r+=DELTA[dir].r; ship.c+=DELTA[dir].c;
      placeShip();
    },350);

    /* прогресс */
    setTimeout(()=>setProgress(step+1),700);

    /* следующий шаг — без вспышки, как в плеере */
    setTimeout(()=>{
      step++;
      if(step>=PATH.length){
        document.getElementById('final').classList.add('show');
      }else{
        pad.querySelectorAll('.arrow').forEach(a=>
          a.classList.remove('correct','faded','locked'));
        refresh();
        locked=false;
      }
    },1800);
  }else{
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),600);
  }
});

/* ── рестарт ────────────────────────────────────── */
function restart(){
  document.getElementById('final').classList.remove('show');
  step=0; ship={...START}; locked=false;
  setProgress(0);
  pad.querySelectorAll('.arrow').forEach(a=>
    a.classList.remove('correct','faded','locked'));
  buildGrid(); refresh();
}

/* старт */
buildGrid(); setProgress(0); refresh();
</script>
</body>
</html>
